<style>
  :root {
    --slot-height: 12px;
    --time-col-width: 64px;
    --col-min-width: 160px;
    --border: #d9dde3;
    --header-bg: #f5f7fa;
    --event-bg: #4285f4;
    --event-fg: #fff;
    --danger: #d93025;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: #202124;
    background: #fff;
  }

  .app-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .app-header h1 { font-size: 18px; margin: 0; }
  .date-range { display: flex; gap: 8px; align-items: center; }
  .date-range input[type="date"] {
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .date-range button {
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 4px;
    cursor: pointer;
  }
  .date-range button:hover { background: var(--header-bg); }
  .status { font-size: 12px; color: #5f6368; margin-left: auto; }
  .status.error { color: var(--danger); }

  .app-main {
    display: grid;
    grid-template-columns: 240px 1fr;
    height: calc(100vh - 60px);
  }

  .sidebar {
    border-right: 1px solid var(--border);
    padding: 12px;
    overflow-y: auto;
  }
  .sidebar h2 { font-size: 14px; margin: 0 0 8px; color: #5f6368; }
  .member-list { list-style: none; padding: 0; margin: 0; }
  .member-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 4px;
  }
  .member-list input[type="checkbox"] { transform: scale(1.1); }
  .member-color {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--event-bg);
    flex-shrink: 0;
  }
  .empty-note {
    font-size: 12px;
    color: #5f6368;
    padding: 8px;
    background: var(--header-bg);
    border-radius: 4px;
  }
  .unavailable { margin-top: 16px; }
  .unavailable h3 { font-size: 12px; color: var(--danger); margin: 0 0 4px; }
  .unavailable ul { margin: 0; padding-left: 16px; font-size: 12px; color: #5f6368; }

  .grid-wrap {
    overflow: auto;
    position: relative;
  }

  .day-sections {
    display: flex;
    flex-direction: column;
  }
  .day-section {
    border-bottom: 8px solid var(--header-bg);
  }
  .day-section:last-child { border-bottom: none; }
  .day-header {
    font-size: 14px;
    font-weight: 600;
    padding: 8px 12px;
    background: #eef2f7;
    border-bottom: 1px solid var(--border);
    position: sticky;
    left: 0;
    z-index: 5;
  }

  .all-day-area {
    display: grid;
    grid-template-columns: var(--time-col-width) 1fr;
    border-bottom: 2px solid var(--border);
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 3;
  }
  .all-day-label {
    font-size: 11px;
    color: #5f6368;
    padding: 4px;
    border-right: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--header-bg);
  }
  .all-day-grid {
    display: grid;
    gap: 2px;
    padding: 4px;
  }

  .time-grid {
    position: relative;
    display: grid;
  }

  .time-col {
    border-right: 1px solid var(--border);
    position: relative;
  }
  .time-col.header {
    position: sticky;
    top: 0;
    background: var(--header-bg);
    z-index: 2;
    padding: 6px 4px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  .time-col.time-label {
    width: var(--time-col-width);
    min-width: var(--time-col-width);
    background: var(--header-bg);
    position: sticky;
    left: 0;
    z-index: 1;
  }
  .time-col.time-label.header { z-index: 4; }

  .hour-mark {
    position: absolute;
    left: 0;
    right: 0;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: #5f6368;
    padding-left: 4px;
  }
  .half-hour-mark {
    position: absolute;
    left: 0;
    right: 0;
    border-top: 1px dashed #eceff1;
  }

  .member-column {
    position: relative;
    min-width: var(--col-min-width);
  }

  .event-block {
    position: absolute;
    left: 4px;
    right: 4px;
    background: var(--event-bg);
    color: var(--event-fg);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 1px 2px rgba(0,0,0,0.12);
  }
  .event-block .time {
    font-size: 10px;
    opacity: 0.9;
    display: block;
  }

  .all-day-event {
    background: var(--event-bg);
    color: var(--event-fg);
    border-radius: 3px;
    padding: 2px 6px;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>
