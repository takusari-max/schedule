<script>
(function () {
  'use strict';

  const state = {
    members: [],
    config: { dayStartHour: 8, dayEndHour: 20, slotMinutes: 15, timezone: 'Asia/Tokyo' },
    events: [],
    unavailable: []
  };

  const $ = (id) => document.getElementById(id);

  function setStatus(text, isError) {
    const el = $('status');
    el.textContent = text || '';
    el.classList.toggle('error', !!isError);
  }

  function todayISO(offsetDays) {
    const d = new Date();
    d.setDate(d.getDate() + (offsetDays || 0));
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function init() {
    $('startDate').value = todayISO(0);
    $('endDate').value = todayISO(1);

    $('reloadBtn').addEventListener('click', loadSchedules);
    $('startDate').addEventListener('change', loadSchedules);
    $('endDate').addEventListener('change', loadSchedules);

    setStatus('設定を読み込み中…');
    google.script.run
      .withSuccessHandler(onConfigLoaded)
      .withFailureHandler(onFailure)
      .getConfig();
  }

  function onConfigLoaded(res) {
    state.config = Object.assign(state.config, parseConfig(res.config || {}));
    // 初回は CSV を読み込みつつ Members 自動同期を走らせる
    // (メンバー一覧は getSchedules の応答で描画する)
    loadSchedules();
  }

  function parseConfig(raw) {
    return {
      dayStartHour: Number(raw.dayStartHour) || 8,
      dayEndHour: Number(raw.dayEndHour) || 20,
      slotMinutes: Number(raw.slotMinutes) || 15,
      timezone: raw.timezone || 'Asia/Tokyo'
    };
  }

  function renderMemberList() {
    const ul = $('memberList');
    ul.innerHTML = '';
    state.members.forEach(m => {
      const li = document.createElement('li');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!m.visible;
      cb.addEventListener('change', () => toggleMember(m, cb.checked));
      const color = document.createElement('span');
      color.className = 'member-color';
      if (m.color) color.style.background = m.color;
      const name = document.createElement('span');
      name.textContent = m.name || m.calendarId;
      name.title = m.calendarId;
      li.appendChild(cb);
      li.appendChild(color);
      li.appendChild(name);
      ul.appendChild(li);
    });
  }

  function toggleMember(member, visible) {
    // クライアント側のみで表示切替 (サーバーへの保存・再読込はしない)
    member.visible = visible;
    renderGrid();
  }

  function loadSchedules() {
    const startStr = $('startDate').value;
    const endStr = $('endDate').value;
    if (!startStr || !endStr) return;
    const start = new Date(startStr + 'T00:00:00');
    const end = new Date(endStr + 'T00:00:00');
    end.setDate(end.getDate() + 1); // 終了日を含めるため翌日0時まで
    if (end <= start) {
      setStatus('終了日は開始日以降にしてください。', true);
      return;
    }
    // 更新のたびにメンバー・予定表示を一度リセットしてから再読込
    resetView_();
    setStatus('予定を取得中…');
    google.script.run
      .withSuccessHandler(onSchedulesLoaded)
      .withFailureHandler(onFailure)
      .getSchedules(start.toISOString(), end.toISOString());
  }

  function resetView_() {
    state.members = [];
    state.events = [];
    state.unavailable = [];
    $('memberList').innerHTML = '';
    $('memberEmpty').hidden = true;
    $('daySections').innerHTML = '';
  }

  function onSchedulesLoaded(res) {
    state.events = res.events || [];
    state.unavailable = res.unavailable || [];
    state.members = res.members || [];
    $('memberEmpty').hidden = state.members.length > 0;
    renderMemberList();
    renderUnavailable();
    renderGrid();
    setStatus('');
  }

  function renderUnavailable() {
    // CSV データソースでは取得不可リストを使用しない (残しておくと無害)
  }

  function renderGrid() {
    const container = $('daySections');
    container.innerHTML = '';

    const visibleMembers = state.members.filter(m => m.visible);
    if (visibleMembers.length === 0) {
      container.innerHTML = '<div class="empty-note" style="padding:16px">表示するメンバーを選択してください。</div>';
      return;
    }

    const startStr = $('startDate').value;
    const endStr = $('endDate').value;
    const rangeStart = new Date(startStr + 'T00:00:00');
    const rangeEnd = new Date(endStr + 'T00:00:00');
    rangeEnd.setDate(rangeEnd.getDate() + 1);

    const days = [];
    for (let d = new Date(rangeStart); d < rangeEnd; d.setDate(d.getDate() + 1)) {
      days.push(new Date(d));
    }

    days.forEach(day => container.appendChild(buildDaySection_(day, visibleMembers)));
  }

  function buildDaySection_(day, visibleMembers) {
    const startHour = state.config.dayStartHour;
    const endHour = state.config.dayEndHour;
    const slot = state.config.slotMinutes;
    const minutesPerDay = (endHour - startHour) * 60;
    const slotHeight = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--slot-height')) || 12;
    const pxPerMinute = slotHeight / slot;
    const dayHeight = minutesPerDay * pxPerMinute;

    const section = document.createElement('section');
    section.className = 'day-section';

    // 日付ヘッダ
    const header = document.createElement('div');
    header.className = 'day-header';
    header.textContent = formatDay(day);
    section.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'time-grid';
    grid.style.gridTemplateColumns = 'var(--time-col-width) repeat(' + visibleMembers.length + ', var(--col-width))';

    // ヘッダ行: 時間 + 各メンバー名
    const timeHeader = document.createElement('div');
    timeHeader.className = 'time-col time-label header';
    timeHeader.textContent = '時間';
    grid.appendChild(timeHeader);
    visibleMembers.forEach(m => {
      const h = document.createElement('div');
      h.className = 'time-col header';
      h.textContent = m.name || m.calendarId;
      h.title = m.calendarId;
      grid.appendChild(h);
    });

    // 時間ラベル列
    const timeCol = document.createElement('div');
    timeCol.className = 'time-col time-label';
    timeCol.style.height = dayHeight + 'px';
    for (let h = startHour; h <= endHour; h++) {
      const mark = document.createElement('div');
      mark.className = 'hour-mark';
      mark.style.top = ((h - startHour) * 60 * pxPerMinute) + 'px';
      mark.textContent = String(h).padStart(2, '0') + ':00';
      timeCol.appendChild(mark);
    }
    grid.appendChild(timeCol);

    // メンバー列
    const dayStart = new Date(day); dayStart.setHours(startHour, 0, 0, 0);
    const dayEnd = new Date(day); dayEnd.setHours(endHour, 0, 0, 0);
    const dayStartMs = new Date(day).setHours(0, 0, 0, 0);
    const dayEndMs = dayStartMs + 24 * 60 * 60 * 1000;

    const allDayItems = [];
    visibleMembers.forEach(m => {
      const col = document.createElement('div');
      col.className = 'member-column';
      col.style.height = dayHeight + 'px';

      for (let h = startHour; h < endHour; h++) {
        const hm = document.createElement('div');
        hm.className = 'hour-mark';
        hm.style.top = ((h - startHour) * 60 * pxPerMinute) + 'px';
        col.appendChild(hm);
        const half = document.createElement('div');
        half.className = 'half-hour-mark';
        half.style.top = (((h - startHour) * 60 + 30) * pxPerMinute) + 'px';
        col.appendChild(half);
      }

      const dayEvents = state.events.filter(ev =>
        ev.calendarId === m.calendarId &&
        ev.endMs > dayStartMs && ev.startMs < dayEndMs
      );

      dayEvents.forEach(ev => {
        if (ev.allDay) {
          allDayItems.push({ ev: ev, member: m });
          return;
        }
        const evStart = Math.max(ev.startMs, dayStart.getTime());
        const evEnd = Math.min(ev.endMs, dayEnd.getTime());
        if (evEnd <= evStart) return; // 表示時間外
        const topMin = (evStart - dayStart.getTime()) / 60000;
        const heightMin = (evEnd - evStart) / 60000;
        const block = document.createElement('div');
        block.className = 'event-block';
        block.style.top = (topMin * pxPerMinute) + 'px';
        block.style.height = Math.max(heightMin * pxPerMinute, 16) + 'px';
        block.dataset.eventKey = ev.eventKey;
        block.dataset.calendarId = ev.calendarId;
        renderEventContent(block, ev);
        col.appendChild(block);
      });

      grid.appendChild(col);
    });

    // 終日イベント (この日分のみ)
    if (allDayItems.length > 0) {
      const allDayArea = document.createElement('div');
      allDayArea.className = 'all-day-area';
      const label = document.createElement('div');
      label.className = 'all-day-label';
      label.textContent = '終日';
      const allDayGrid = document.createElement('div');
      allDayGrid.className = 'all-day-grid';
      allDayGrid.style.gridTemplateColumns = 'repeat(' + visibleMembers.length + ', var(--col-width))';
      visibleMembers.forEach(m => {
        const cell = document.createElement('div');
        cell.className = 'all-day-cell';
        allDayItems
          .filter(x => x.member.calendarId === m.calendarId)
          .forEach(({ ev }) => {
            const el = document.createElement('div');
            el.className = 'all-day-event';
            el.textContent = ev.title;
            el.title = ev.title;
            cell.appendChild(el);
          });
        allDayGrid.appendChild(cell);
      });
      allDayArea.appendChild(label);
      allDayArea.appendChild(allDayGrid);
      section.appendChild(allDayArea);
    }

    section.appendChild(grid);
    return section;
  }

  function sameDay_(a, b) {
    return a.getFullYear() === b.getFullYear() &&
           a.getMonth() === b.getMonth() &&
           a.getDate() === b.getDate();
  }

  function renderEventContent(block, ev) {
    block.innerHTML = '';
    const text = document.createElement('span');
    text.textContent = ev.title;
    block.appendChild(text);
    const t = document.createElement('span');
    t.className = 'time';
    t.textContent = formatHM(new Date(ev.startMs)) + '–' + formatHM(new Date(ev.endMs));
    block.appendChild(t);
  }

  function formatDay(d) {
    const w = ['日','月','火','水','木','金','土'][d.getDay()];
    return (d.getMonth() + 1) + '/' + d.getDate() + '(' + w + ')';
  }
  function formatHM(d) {
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function onFailure(err) {
    console.error(err);
    setStatus((err && err.message) || 'エラーが発生しました', true);
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
